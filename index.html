<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d5bd0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>TEEM 2027</title>

  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #242230;
      --muted: #706d7c;
      --accent: #6d5bd0;
      --accent2: #ebe7ff;
      --green: #2e8b57;
      --border: #e4e2eb;
      --danger: #b53a3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(760px, 100%);
      margin: auto;
      padding: 18px;
    }

    h1 { margin-bottom: 4px; }
    h2 { font-size: 1.1rem; }

    .muted { color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .progress {
      height: 12px;
      background: #eceaf2;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .25s;
    }

    button {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    button.active {
      background: var(--accent2);
      border-color: var(--accent);
    }

    button.danger {
      color: var(--danger);
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      padding: 15px;
      font-weight: 700;
    }

    .week-meta {
      font-weight: 400;
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .tasks {
      padding: 4px 14px 14px;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 4px;
      border-top: 1px solid #f0eef4;
    }

    .task input {
      margin-top: 4px;
      width: 21px;
      height: 21px;
      accent-color: var(--accent);
    }

    .task.done span {
      text-decoration: line-through;
      color: #999;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent2);
      color: var(--accent);
      font-size: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    textarea { min-height: 90px; }

    label.small {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .saved {
      color: var(--green);
      font-size: 13px;
      min-height: 20px;
      margin-top: 8px;
    }

    @media (max-width: 520px) {
      .stats-grid { grid-template-columns: 1fr; }
      .app { padding: 12px; }
    }
  </style>
</head>

<body>
<div class="app">

  <h1>TEEM 2027</h1>
  <p class="muted">Plano diário de estudos • Setembro/2026 a Fevereiro/2027</p>

  <section class="card">
    <strong>Progresso geral</strong>
    <div class="progress" style="margin-top:10px">
      <div id="progressBar"></div>
    </div>
    <p id="progressText" class="muted">0% concluído</p>
  </section>

  <section class="card">
    <strong>Regra principal</strong>
    <p class="muted">
      Uma tarefa perdida não vira dívida. Continue do ponto atual.
      Nas semanas mais difíceis, flashcards ou 5 questões já contam como contato ativo.
    </p>
  </section>

  <div class="buttons">
    <button data-filter="all" class="filter active">Todas</button>
    <button data-filter="pending" class="filter">Pendentes</button>
    <button data-filter="done" class="filter">Concluídas</button>
  </div>

  <div id="weeks"></div>

  <section class="card">
    <h2>Simulados</h2>

    <div class="stats-grid">
      <div>
        <label class="small">Nota do último simulado (%)</label>
        <input type="number" id="score" min="0" max="100">
      </div>

      <div>
        <label class="small">Questões realizadas na semana</label>
        <input type="number" id="questionCount" min="0">
      </div>
    </div>

    <div style="margin-top:12px">
      <label class="small">Principais assuntos errados</label>
      <textarea id="weakTopics"
        placeholder="Ex.: nódulo tireoidiano, DRC no diabetes..."></textarea>
    </div>

    <div style="margin-top:12px">
      <label class="small">Erros K / R / D</label>
      <textarea id="errors"
        placeholder="K = conhecimento | R = raciocínio | D = distração"></textarea>
    </div>

    <button id="saveStats" style="margin-top:12px">
      Salvar acompanhamento
    </button>

    <div id="savedMessage" class="saved"></div>
  </section>

  <button id="reset" class="danger">
    Apagar todos os checks
  </button>

</div>

const state = JSON.parse(localStorage.getItem("teem2027") || "{}");
state.tasks ||= {};
state.stats ||= {};

const container = document.getElementById("weeks");
let taskNumber = 0;

weeks.forEach((week, weekIndex) => {
  const details = document.createElement("details");
  if (weekIndex === 0) details.open = true;

  const summary = document.createElement("summary");
  summary.innerHTML = `
    ${week.title}
    <div class="week-meta">${week.load}</div>
    <span class="badge" id="week-${weekIndex}"></span>
  `;
  details.appendChild(summary);

  const taskBox = document.createElement("div");
  taskBox.className = "tasks";

  week.tasks.forEach(text => {
    taskNumber++;
    const id = "t" + taskNumber;

    const label = document.createElement("label");
    label.className = "task";
    label.dataset.id = id;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!state.tasks[id];

    const span = document.createElement("span");
    span.textContent = text;

    if (cb.checked) label.classList.add("done");

    cb.addEventListener("change", () => {
      state.tasks[id] = cb.checked;
      label.classList.toggle("done", cb.checked);
      save();
      updateProgress();
    });

    label.append(cb, span);
    taskBox.appendChild(label);
  });

  details.appendChild(taskBox);
  container.appendChild(details);
});

function save() {
  localStorage.setItem("teem2027", JSON.stringify(state));
}

function updateProgress() {
  const checkboxes = [...document.querySelectorAll(".task input")];
  const done = checkboxes.filter(x => x.checked).length;
  const total = checkboxes.length;
  const pct = Math.round((done / total) * 100);

  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressText").textContent =
    `${pct}% concluído • ${done}/${total} metas`;

  weeks.forEach((week, i) => {
    const details = document.querySelectorAll("details")[i];
    const checks = [...details.querySelectorAll("input")];
    const complete = checks.filter(x => x.checked).length;
    document.getElementById(`week-${i}`).textContent =
      `${complete}/${checks.length}`;
  });

  applyFilter();
}

let filter = "all";

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;

    document.querySelectorAll(".filter").forEach(b =>
      b.classList.toggle("active", b === btn)
    );

    applyFilter();
  });
});

function applyFilter() {
  document.querySelectorAll(".task").forEach(task => {
    const done = task.querySelector("input").checked;

    task.style.display =
      filter === "all" ||
      (filter === "done" && done) ||
      (filter === "pending" && !done)
        ? "flex"
        : "none";
  });
}

document.getElementById("score").value = state.stats.score || "";
document.getElementById("questionCount").value =
  state.stats.questionCount || "";
document.getElementById("weakTopics").value =
  state.stats.weakTopics || "";
document.getElementById("errors").value =
  state.stats.errors || "";

document.getElementById("saveStats").addEventListener("click", () => {
  state.stats = {
    score: document.getElementById("score").value,
    questionCount: document.getElementById("questionCount").value,
    weakTopics: document.getElementById("weakTopics").value,
    errors: document.getElementById("errors").value
  };

  save();

  const msg = document.getElementById("savedMessage");
  msg.textContent = "Acompanhamento salvo ✓";
  setTimeout(() => msg.textContent = "", 1800);
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Apagar todos os checks do cronograma?")) return;

  state.tasks = {};
  save();

  document.querySelectorAll(".task input").forEach(x => {
    x.checked = false;
    x.closest(".task").classList.remove("done");
  });

  updateProgress();
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}

updateProgress();
</script>
